[project]
name = "book-crud"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.5,<6",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.162.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.1.8",
    "sqlmodel>=0.0.48",
]

[tool.fastapi]
entrypoint = "src:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
